name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:package
      - run: npm run size
      - run: npm run docs

  # The published bundle has no Node APIs and targets ES2020: check it still loads on Node 18.
  runtime-node18:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Load CJS build
        run: |
          node -e "const { deprecate } = require('./dist/index.cjs'); deprecate(() => 1, { name: 'smoke' })()"
      - name: Load ESM build
        run: |
          node --input-type=module -e "const { deprecate } = await import('./dist/index.js'); deprecate(() => 1, { name: 'smoke' })()"
