name: Release

# Publishes to npm when a tag like v1.2.3 is pushed.
# Uses npm trusted publishing (OIDC): configure it once at
# npmjs.com -> package settings -> Trusted publishing -> GitHub Actions (workflow: release.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
